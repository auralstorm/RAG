[project]
name = "enterprise-rag-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["enterprise-rag-backend"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
enterprise-rag-backend = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
include = ["backend/app", "backend/tests", "scripts"]
extraPaths = ["backend"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra -m 'not infrastructure'"
markers = ["infrastructure: starts this project's isolated Docker test environment"]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.6",
]
