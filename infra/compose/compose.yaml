services:
  postgres:
    image: ${POSTGRES_IMAGE:?}
    environment:
      POSTGRES_DB: ${ENTERPRISE_RAG_POSTGRES_DATABASE:?}
      POSTGRES_USER: ${ENTERPRISE_RAG_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${ENTERPRISE_RAG_POSTGRES_PASSWORD:?}
    ports:
      - '127.0.0.1:${ENTERPRISE_RAG_POSTGRES_PORT:?}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-phoenix.sql:ro
    healthcheck:
      test:
        [
          CMD-SHELL,
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:?}
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --requirepass,
        '${ENTERPRISE_RAG_REDIS_PASSWORD:?}',
      ]
    environment:
      REDISCLI_AUTH: ${ENTERPRISE_RAG_REDIS_PASSWORD:?}
    ports:
      - '127.0.0.1:${ENTERPRISE_RAG_REDIS_PORT:?}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    restart: unless-stopped

  rabbitmq:
    image: ${RABBITMQ_IMAGE:?}
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${ENTERPRISE_RAG_RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${ENTERPRISE_RAG_RABBITMQ_PASSWORD:?}
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2'
      RABBITMQ_CTL_ERL_ARGS: '+S 1:1'
    ports:
      - '127.0.0.1:${ENTERPRISE_RAG_RABBITMQ_PORT:?}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:?}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:?}
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.ml.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '127.0.0.1:${ELASTICSEARCH_PORT:?}:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          CMD-SHELL,
          'curl -fsS "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=3s" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    mem_limit: 1536m
    restart: unless-stopped

  rustfs-volume-init:
    extends:
      file: rustfs.yaml
      service: rustfs-volume-init

  rustfs:
    extends:
      file: rustfs.yaml
      service: rustfs

  phoenix:
    image: ${PHOENIX_IMAGE:?}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${ENTERPRISE_RAG_POSTGRES_USER:?}:${ENTERPRISE_RAG_POSTGRES_PASSWORD:?}@postgres:5432/phoenix
    ports:
      - '127.0.0.1:${PHOENIX_PORT:?}:6006'
      - '127.0.0.1:${PHOENIX_GRPC_PORT:?}:4317'
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 4s
      retries: 40
      start_period: 20s
    mem_limit: 1024m
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  rustfs-data:
  rustfs-logs:
